<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人记账本：记录日常收支并查看历史账单">
    <title>个人记账本 - 记录</title>
    <link rel="icon" type="image/png" href="img/校徽.png">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <!-- 顶部导航：模块负责人 成员 F -->
    <header class="topbar">
        <div class="shell-brand">
            <img class="shell-brand__logo" src="img/校徽.png" alt="福州大学校徽">
            <img class="shell-brand__logo" src="img/院徽.png" alt="福州大学计算机与大数据学院院徽">
            <h1 class="topbar__title">个人记账本</h1>
        </div>
        <nav class="topbar__nav">
            <a href="statistics.html">统计</a>
        </nav>
    </header>

    <main class="layout">
        <!-- 新增记账表单：成员 G -->
        <section id="record-form" class="card">
            <h2 class="card__title">新增记账</h2>
            <form id="record-form-element" class="form" novalidate>
                <div class="form__field form__field--type">
                    <label for="type">类型</label>
                    <select id="type" name="type" required>
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>

                <div class="form__field form__field--amount">
                    <label for="amount">金额（元）</label>
                    <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01"
                        placeholder="0.00" autocomplete="off" required aria-describedby="amount-error">
                    <p class="form__hint">需大于 0，最多两位小数</p>
                    <p class="form__error" id="amount-error" hidden></p>
                </div>

                <div class="form__field form__field--date">
                    <label for="date">日期</label>
                    <input id="date" name="date" type="date" required aria-describedby="date-error">
                    <p class="form__error" id="date-error" hidden></p>
                </div>

                <div class="form__field form__field--category">
                    <label for="category">类别</label>
                    <select id="category" name="category" required aria-describedby="category-error">
                        <option value="">请选择类别</option>
                        <option value="饮食">饮食</option>
                        <option value="交通">交通</option>
                        <option value="购物">购物</option>
                        <option value="居住">居住</option>
                        <option value="娱乐">娱乐</option>
                        <option value="医疗">医疗</option>
                        <option value="教育">教育</option>
                        <option value="工资">工资</option>
                        <option value="奖金">奖金</option>
                        <option value="兼职">兼职</option>
                        <option value="理财">理财</option>
                        <option value="其他">其他</option>
                    </select>
                    <p class="form__error" id="category-error" hidden></p>
                </div>

                <div class="form__field form__field--remark">
                    <label for="remark">备注<span class="form__hint">（选填）</span></label>
                    <input id="remark" name="remark" type="text" maxlength="200" placeholder="例如：午餐"
                        autocomplete="off">
                </div>

                <div class="form__actions">
                    <button type="submit" class="button button--primary">保存</button>
                    <p id="form-message" class="form__message" role="status" aria-live="polite"></p>
                </div>
            </form>
        </section>

        <!-- 历史账单列表：成员 H -->
        <section id="record-list" class="card">
            <h2 class="card__title">历史账单</h2>
            <div class="filters">
                <input id="filter-start-date" type="date" aria-label="开始日期">
                <input id="filter-end-date" type="date" aria-label="结束日期">
                <select id="filter-type" aria-label="类型">
                    <option value="">全部类型</option>
                    <option value="income">收入</option>
                    <option value="expense">支出</option>
                </select>
                <input id="filter-category" type="text" placeholder="类别" aria-label="类别">
                <button id="filter-apply" type="button" class="button">筛选</button>
            </div>

            <table class="records">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>类型</th>
                        <th>类别</th>
                        <th>金额（元）</th>
                        <th>备注</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="record-list-body">
                    <!-- 由 records.js 渲染 -->
                </tbody>
            </table>

            <button id="load-more" type="button" class="button">查看更多</button>
            <p id="records-message" class="form__message" role="status"></p>
        </section>
    </main>

    <footer class="shell-footer">
        <p class="shell-footer__text">© 蛋仔派队 版权所有<br>Copyright © 2026 All Rights Reserved</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/records.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
